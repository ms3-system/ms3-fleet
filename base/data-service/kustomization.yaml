apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - statefulset.yaml
  - service.yaml

configMapGenerator:
  - name: data-service-config
    literals:
      - DATA_SERVICE_DATA_DIR=/app/data
labels:
  - includeSelectors: true
    pairs:
      app.kubernetes.io/name: data-service
      app.kubernetes.io/part-of: ms3
