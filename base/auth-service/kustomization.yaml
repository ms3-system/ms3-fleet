apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - statefulset.yaml
  - service.yaml

configMapGenerator:
  - name: auth-service-config
    literals:
      - AUTH_SERVICE_DB_PATH=/app/data/auth.db

labels:
  - includeSelectors: true
    pairs:
      app.kubernetes.io/name: auth-service
      app.kubernetes.io/part-of: ms3
