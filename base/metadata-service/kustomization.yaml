apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - statefulset.yaml
  - service.yaml

configMapGenerator:
  - name: metadata-service-config
    literals:
      - METADATA_SERVICE_DB_PATH=/app/data/metadata.db
labels:
  - includeSelectors: true
    pairs:
      app.kubernetes.io/name: metadata-service
      app.kubernetes.io/part-of: ms3
