apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root-argo
  namespace: argocd
spec:
  project: default
  source:
    repoURL: "https://github.com/ms3-system/ms3-fleet"
    targetRevision: main
    path: argocd-apps
  destination:
    server: "https://kubernetes.default.svc"
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
