apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prow-infra
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/ms3-system/prow
    targetRevision: main
    path: prow-infra
  destination:
    server: https://kubernetes.default.svc
    namespace: prow
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
